[project]
name = "masr-pay-mcp-unofficial"
version = "0.1.0"
description = "Unofficial MCP server for Egyptian payment providers, starting with FawryPay (Pay-at-Fawry cash payments). Not affiliated with or endorsed by any provider."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mohamed Aly", email = "178811720+mohamedaly-cloud@users.noreply.github.com" }]
keywords = ["mcp", "fawry", "fawrypay", "egypt", "payments", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=2.3,<3",  # official MCP Python SDK v2 (protocol 2026-07-28)
    "httpx2>=2.10",  # HTTP client for Fawry; already a dependency of the MCP SDK
]

[project.urls]
Homepage = "https://github.com/mohamedaly-cloud/masr-pay-mcp-unofficial"
Issues = "https://github.com/mohamedaly-cloud/masr-pay-mcp-unofficial/issues"

[project.scripts]
masr-pay-mcp-unofficial = "masr_pay_mcp.__main__:main"

[project.optional-dependencies]
# The mock Fawry API (FastAPI app + ASGI server to run it locally).
mock = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "masr-pay-mcp-unofficial[mock]",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["masr_pay_mcp", "mock_fawry"]

# Hatch skips only .gitignore'd files, so list what the sdist ships instead of shipping the tree.
[tool.hatch.build.targets.sdist]
include = ["masr_pay_mcp", "mock_fawry", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
# `ruff format` owns line length; long prose strings (tool descriptions) are left alone.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; the fake keys in tests are not secrets.
"tests/**" = ["S101", "S105", "S106"]
