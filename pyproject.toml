[project]
name = "fawry-mcp-unofficial"
version = "0.1.0"
description = "Unofficial MCP server for FawryPay (Pay-at-Fawry cash payments). Not affiliated with or endorsed by Fawry."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# The mock Fawry API (FastAPI app + ASGI server to run it locally).
mock = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "fawry-mcp-unofficial[mock]",
    "httpx>=0.27",  # required by FastAPI's TestClient
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fawry_mcp", "mock_fawry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; the fake keys in tests are not secrets.
"tests/**" = ["S101", "S105", "S106"]
